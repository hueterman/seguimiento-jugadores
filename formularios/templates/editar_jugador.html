{% extends "base.html" %}
{% block content %}
<h1>Editar {{ jugador["nombre"] }} {{ jugador["apellidos"] }}</h1>
<form method="post">
  <label>Nombre <input name="nombre" value="{{ jugador['nombre'] }}" required></label>
  <label>Apellidos <input name="apellidos" value="{{ jugador['apellidos'] }}" required></label>
  <label>Fecha de nacimiento <input type="date" name="fecha_nacimiento" value="{{ jugador['fecha_nacimiento'] or '' }}"></label>
  <label>Nacionalidad <input name="nacionalidad" value="{{ jugador['nacionalidad'] or '' }}"></label>
  <label>Posición
    <select name="posicion_id">
      <option value="">-- Selecciona --</option>
      {% for p in posiciones %}
      <option value="{{ p['id'] }}" {% if jugador['posicion_id'] == p['id'] %}selected{% endif %}>{{ p['nombre'] }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Altura (cm) <input type="number" name="altura_cm" value="{{ jugador['altura_cm'] or '' }}"></label>
  <label>Peso (kg) <input type="number" name="peso_kg" value="{{ jugador['peso_kg'] or '' }}"></label>
  <label>Mano dominante
    <select name="mano_dominante_id">
      <option value="">-- Selecciona --</option>
      {% for m in manos %}
      <option value="{{ m['id'] }}" {% if jugador['mano_dominante_id'] == m['id'] %}selected{% endif %}>{{ m['nombre'] }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Estado actual
    <select name="estado_actual_id">
      {% for e in estados %}
      <option value="{{ e['id'] }}" {% if jugador['estado_actual_id'] == e['id'] %}selected{% endif %}>{{ e['nombre'] }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit">Guardar</button>
</form>
{% endblock %}
