<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Seguimiento de jugadores</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; color: #222; }
    body.ancho { max-width: 1100px; }
    nav a { margin-right: 1rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; font-size: 0.9rem; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; }
    .tabla-scroll { overflow-x: auto; margin-top: 1rem; }
    .tabla-scroll table { margin-top: 0; }
    .ficha-cabecera { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .ficha-foto { width: 120px; height: 120px; object-fit: contain; background: #f0f0f0; border-radius: 0.5rem; }
    .ficha-cabecera h1 { margin: 0; }
    form label { display: block; margin-top: 0.75rem; }
    input, select, textarea { width: 100%; padding: 0.3rem; box-sizing: border-box; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; }
    h2 { margin-top: 2rem; }
  </style>
</head>
<body class="{% block body_class %}{% endblock %}">
  <nav>
    <a href="{{ url_for('routes.index') }}">Jugadores</a>
    <a href="{{ url_for('routes.buscar_texto') }}">Buscar texto libre</a>
    <a href="{{ url_for('routes.buscar_estadisticas') }}">Buscar por estadísticas</a>
    <a href="{{ url_for('routes.entrenadores') }}">Entrenadores</a>
    <a href="{{ url_for('routes.nuevo_jugador') }}">+ Jugador</a>
    <a href="{{ url_for('routes.nuevo_equipo') }}">+ Equipo</a>
    <a href="{{ url_for('routes.nueva_lesion') }}">+ Lesión</a>
    <a href="{{ url_for('routes.nuevo_dato_economico') }}">+ Dato económico</a>
  </nav>
  <hr>
  {% block content %}{% endblock %}
</body>
</html>
